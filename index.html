<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밴드업</title>
<meta name="description" content="IELTS Academic 6.5 코치, 매일 5분부터">
<meta name="theme-color" content="#F5F6F8" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="밴드업">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css">
<script>try{var t=(JSON.parse(localStorage.getItem('bandup.db')||'{}').settings||{}).theme||'auto',h=new Date().getHours();if(t==='auto')t=h>=22||h<6?'dark':'system';if(t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app" id="app">
  <nav class="nav" id="nav" aria-label="메인"></nav>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="panel" id="panel" aria-label="오늘 진행"></aside>
</div>
<section class="stage" id="stage" hidden aria-modal="true" role="dialog" aria-labelledby="stTtl" tabindex="-1"></section>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
<div class="toast-wrap" id="toast" aria-live="polite"></div>
<audio id="au" preload="none"></audio>
<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
